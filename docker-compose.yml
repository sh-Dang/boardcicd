version: "3.8"

services:
  backend:
    build: ./backend
    container_name: boardcicd-backend
    ports:
      - "8888:8888"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  frontend:
    build: ./frontend
    container_name: boardcicd-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend