name: boardcicd

on:
  push:
    # main 브랜치에 push 발생 시 실행
    branches: [ "main" ]

# GitHub Actions 권한 설정
permissions:
  # repository 코드 읽기 권한
  contents: read

  # GHCR(GitHub Container Registry)에 이미지 push 권한
  packages: write

# 전역 환경 변수
env:
  # 사용할 Docker Registry 주소
  REGISTRY: ghcr.io

jobs:

  # =========================
  # Docker 이미지 빌드 및 push
  # =========================
  build-and-push:

    # GitHub Actions 실행 환경
    runs-on: ubuntu-latest

    steps:

      # 저장소 코드 checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Buildx 설정
      # - 멀티 플랫폼 빌드 지원
      # - 캐시 기능 지원
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub 사용자명(owner)을 소문자로 변환
      # GHCR 이미지 이름은 소문자만 허용됨
      - name: Convert owner to lowercase
        id: owner
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      # GHCR 로그인
      # github.actor -> 현재 workflow 실행 사용자
      # GITHUB_TOKEN -> GitHub가 자동 제공하는 토큰
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # Backend Docker Image Build & Push
      # =========================
      - name: boardcicd backend
        uses: docker/build-push-action@v6
        with:

          # Docker build context
          # backend 폴더 내부를 기준으로 빌드
          context: ./backend

          # 사용할 Dockerfile 위치
          file: ./backend/Dockerfile

          # 빌드 후 GHCR에 push 수행
          push: true

          # Docker 이미지 태그 설정
          tags: |
  
            # 최신 버전 태그
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/boardcicd-backend:latest

            # 커밋 SHA 기반 태그
            # 특정 버전 롤백 가능
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/boardcicd-backend:${{ github.sha }}

      # =========================
      # Frontend Docker Image Build & Push
      # =========================
      - name: boardcicd frontend
        uses: docker/build-push-action@v6
        with:

          # frontend 디렉토리 기준 빌드
          context: ./frontend

          # frontend Dockerfile 사용
          file: ./frontend/Dockerfile

          # 빌드 완료 후 GHCR push
          push: true

          # Docker build 시 사용할 build argument
          # Vite 환경변수 주입
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

          # Docker 이미지 태그
          tags: |

            # 최신 태그
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/boardcicd-frontend:latest

            # 특정 커밋 버전 태그
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/boardcicd-frontend:${{ github.sha }}

  # =========================
  # VM 서버 배포 단계
  # =========================
  deploy:

    # build-and-push job 성공 후 실행(조건)
    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      # SSH 접속 후 서버에서 docker-compose 재배포
      - name: SSH로 VM 접속 후 배포
        uses: appleboy/ssh-action@v1.0.0

        with:

          # VM 공인 IP
          host: ${{ secrets.VM_HOST }}

          # 접속 사용자
          username: ubuntu

          # SSH 개인키
          key: ${{ secrets.VM_SSH_KEY }}

          # VM 내부에서 실행되는 명령어 예약
          script: |
  
              # 홈 디렉토리 이동
              cd ~/

              # 기존 컨테이너 종료 및 제거
              docker-compose down --remove-orphans

              # 사용하지 않는 리소스 제거
              # dangling image / stopped container 등 정리
              docker system prune -f

              # 최신 이미지 pull
              # GHCR에서 latest 이미지 다운로드
              docker-compose pull

              # 컨테이너 백그라운드 실행 (최신 이미지 기반으로 재생성)
              docker-compose up -d

              # 사용하지 않는 old image 제거
              docker image prune -f
